[project]
name = "audr"
version = "0.1.1"
description = "Ethereum portfolio tracker — backend API and worker"
requires-python = ">=3.14"
dependencies = [
    # Web framework and ASGI server
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    # Configuration
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # ORM and migrations — 2.0.x series per project spec
    "sqlalchemy>=2.0.54,<2.1",
    "alembic==1.20.0",
    # PostgreSQL driver (psycopg3, binary build)
    "psycopg[binary]==3.3.6",
    # HTTP client (explicit, no implicit redirects)
    "httpx==0.28.1",
    # Ethereum address/ABI utilities
    "eth-utils==6.0.0",
    "eth-abi==6.0.0",
    # Keccak-256 backend for eth_utils.to_checksum_address (AUD-385) — eth-hash
    # has no working backend without this installed.
    "pycryptodome==3.23.0",
    # Authenticated encryption (AES-256-GCM)
    "cryptography==50.0.2",
    # Password hashing (Argon2id)
    "argon2-cffi==25.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    # HTTP mock for httpx
    "respx==0.23.1",
    # Async test utilities
    "anyio[trio]==4.15.1",
    # Type checking
    "mypy==2.3.1",
    "types-psycopg2",
    # Lint + format. Pinned exactly: ruff's formatter output and lint rule set
    # both move between patch releases, so an unpinned ruff means "formatted"
    # depends on whatever the caller happened to have installed. See AUD-392.
    "ruff==0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, dependency-free unit tests",
    "integration: tests that require a live PostgreSQL database",
    "contract: tests that verify provider-interface contracts against fixtures",
]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["src/audr"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
# Deliberately py313, not py314, even though the runtime is Python 3.14
# (`requires-python = ">=3.14"`, and every image is `python:3.14-slim`).
#
# At py314 ruff's formatter applies PEP 758 and rewrites
# `except (OSError, ValueError):` into `except OSError, ValueError:`. That is
# valid Python 3.14 — verified against `python:3.14-slim` — so it is not the
# miscompilation it first looks like. It is still the wrong output for this
# repo, because the same source has to parse under interpreters older than
# 3.14:
#   * `scripts/*.py` are `#!/usr/bin/env python3` and run from a host shell
#     (deploy host, agent boxes), where python3 is routinely 3.10–3.13;
#   * `python:3.13-slim` rejects the unparenthesized form outright with
#     `SyntaxError: multiple exception types must be parenthesized`.
# Holding at py313 keeps one syntax that is valid everywhere. The only thing
# given up is 3.14-only `UP` modernizations, of which there are none we want.
# See AUD-392.
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ANN"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "ANN"]
"src/audr/api/**/*.py" = ["B008"]
"src/audr/auth/dependencies.py" = ["B008"]
# Verbatim pg_dump schema, verified byte-for-byte against a live upgrade (AUD-306).
# Long lines are auto-generated Alembic constraint/index names; wrapping them for
# cosmetic line-length is not worth risking a typo in a verified baseline.
"migrations/versions/0001_baseline.py" = ["E501"]
