# Installed on the deploy host as
# /etc/systemd/system/audr-mirror.service.d/10-dns-race.conf.
#
# `audr-mirror.service`/`.timer` themselves are host-only and predate this
# directory; only this drop-in is tracked, because it is the part that was
# wrong. Install it with `scripts/install-mirror-dropin.sh`.
#
# The bug it fixes: `audr-mirror.timer` is `Persistent=true`, so on boot systemd
# immediately replays the window the host missed while it was off. That catch-up
# run starts before name resolution works, even with `After=network-online.target`
# — `network-online` means an address is configured, not that DNS answers.
# The mirror then dies on
#
#     ssh: Could not resolve hostname github.com: Temporary failure in name resolution
#
# and, being a `Type=oneshot` with no `Restart=`, parks in `failed` until the
# next 15-minute tick. Observed on the 2026-10-07 10:09 UTC reboot.
#
# The sync itself is unharmed — the following tick picks it up — but the stale
# `failed` state is: `systemctl --failed` is the first thing an operator reads on
# a host, and it cannot distinguish this transient boot race from a mirror that
# is genuinely broken (revoked deploy key, Gitea down). Either you learn to
# ignore the unit, or you investigate a non-problem. So: wait for DNS instead of
# failing on it, and retry instead of parking.
[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 30); do getent hosts github.com >/dev/null 2>&1 && exit 0; sleep 2; done; echo \"github.com still unresolvable after 60s\" >&2; exit 1"
Restart=on-failure
RestartSec=30s

[Unit]
# Bounded deliberately. An unbounded `Restart=on-failure` would mean a mirror
# that is actually broken never shows up in `systemctl --failed` either — it
# would sit in `activating (auto-restart)` forever, which is the same blind spot
# with the opposite sign. Four attempts in ten minutes covers a slow boot and
# gives up on anything worse.
StartLimitIntervalSec=600
StartLimitBurst=4
