name: CI

# Runs the project test suite on pushes to main and on pull requests.
# Executes on the self-hosted `host` runner (deploy host 192.168.1.228) so that
# docker compose bind-mounts in compose.test.yaml resolve against the checkout.
#
# The push trigger is filtered to `main` on purpose. This file reaches Gitea
# only through the mirror's overlay, and the overlay is applied to main alone —
# every other branch is pushed verbatim from GitHub, where no .gitea/ directory
# exists — so a bare `on: push` could only ever fire for main anyway. Stating
# the filter keeps that from becoming accidental: if .gitea/workflows is ever
# committed upstream, the mirror would start replaying the full suite on every
# long-stale branch it syncs. Pre-merge coverage comes from `pull_request`.
# See AUD-333.
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    # Python lint gate. Narrow on purpose: it blocks on the error classes that
    # mean "this code cannot run" (E9 syntax, F63/F7 broken constructs, F82
    # undefined names) and nothing else. The full rule set from
    # `backend/pyproject.toml` currently reports 226 findings and
    # `ruff format --check` wants 86 files reformatted, so switching either on
    # wholesale would land a permanently red gate. Widening it is AUD-392.
    #
    # The ruff version is pinned here and in `backend/pyproject.toml` dev
    # extras, and the two must stay in sync — an unpinned ruff makes the gate's
    # verdict depend on the day it ran. See AUD-391.
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: ruff (errors only) — backend
        run: docker run --rm -v "$PWD:/w" -w /w/backend ghcr.io/astral-sh/ruff:0.16.10 check --no-cache --select E9,F63,F7,F82 .
      - name: ruff (errors only) — scripts
        run: docker run --rm -v "$PWD:/w" -w /w ghcr.io/astral-sh/ruff:0.16.10 check --no-cache --select E9,F63,F7,F82 scripts/
      - name: scripts/ must parse on the oldest python3 we run them under
        # `scripts/*.py` are invoked as `python3 scripts/foo.py` from a host
        # shell, not inside the 3.14 image, so they must not use 3.14-only
        # syntax. This is the gate that catches AUD-391 directly: PEP 758
        # `except A, B:` compiles on 3.14 and fails here.
        #
        # compile() in memory rather than `compileall`: this runner is
        # self-hosted and its checkout persists between runs, so a step that
        # writes `__pycache__/` as the container's root user leaves root-owned
        # untracked files behind — `__pycache__` is not in `.gitignore`, and the
        # next `actions/checkout` cleanup cannot remove them.
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.13-slim python -c '
          import pathlib, sys
          paths = sorted(pathlib.Path("scripts").rglob("*.py"))
          bad = 0
          for p in paths:
              try:
                  compile(p.read_text(), str(p), "exec")
              except SyntaxError as exc:
                  print(f"{p}:{exc.lineno}: {exc.msg}", file=sys.stderr)
                  bad += 1
          print(f"checked {len(paths)} files under python {sys.version.split()[0]}")
          sys.exit(1 if bad else 0)
          '

  backend-tests:
    runs-on: host
    env:
      # compose.test.yaml declares the fixed project name `audr-test`, so every
      # `docker compose -f compose.test.yaml` invocation on this host shares the
      # same containers, volumes and `audr-test_test-net` network. A concurrent
      # local run — or a second CI job, now that the runner is at capacity 2 —
      # therefore collides, and either side's `down -v --remove-orphans`
      # destroys the other's database mid-run. That is what produced CI run #51
      # (migrate-test exit 255, teardown logging "Network audr-test_test-net
      # Resource is still in use") on a sha that was green on the next run with
      # no code change. Namespace the stack per run so runs cannot see each
      # other. See AUD-310.
      COMPOSE_PROJECT: audr-test-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - name: Backend unit + integration tests (compose)
        run: docker compose -p "$COMPOSE_PROJECT" -f compose.test.yaml --profile backend run --rm --build backend-tests
      - name: Teardown
        if: always()
        run: |
          docker compose -p "$COMPOSE_PROJECT" -f compose.test.yaml down -v --remove-orphans
          # Per-run project names mean a killed runner leaks a network, and the
          # default Docker address pool only holds a few dozen bridges. Reap
          # leftovers from earlier runs: `docker network rm` refuses a network
          # that still has a container attached, so a live concurrent run is
          # never disturbed.
          for net in $(docker network ls --filter 'name=^audr-test-' --format '{{.Name}}'); do
            docker network rm "$net" >/dev/null 2>&1 || true
          done

  frontend-tests:
    # Runs in a container (ubuntu-latest label) with Node pinned to 22 to match
    # the project's build toolchain (native rolldown/vite bindings need Node 22).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Frontend tests (vitest)
        working-directory: frontend
        run: |
          npm ci
          npm run test
