name: Build & Deploy (guarded)

# Guarded build + auto-deploy pipeline for the audr stack (AUD-294).
#
# One serialized job on the self-hosted `host` runner, which is also the deploy
# host. Build and deploy live in ONE job so ordering and image
# freshness are guaranteed — no cross-workflow race.
#
# Serialization used to come for free from the runner's capacity of 1. That
# capacity is now 2 (AUD-310 item 2, so CI jobs stop queueing behind each
# other), which would let two pushes to main deploy concurrently against the
# same live stack, the same :rollback tag and the same Harbor :latest. The
# `concurrency` group below restores the guarantee explicitly and is shared
# with build.yaml, the other workflow that moves :latest.
#
# Safety guards (added after the 2026-09-28 auto-deploy outage):
#   1. Secrets preflight — refuses to deploy if ~/audr/.env or the db_password
#      secret is missing. The stack's DB password is fixed at DB init; a missing
#      /regenerated secret is exactly what caused the "password authentication
#      failed" outage, so we hard-fail instead of proceeding.
#   2. Rollback snapshot — the currently-running :latest images are retagged
#      :rollback (and pushed to Harbor, so the rollback path does not depend on
#      the host's local image cache surviving a prune), AND the pre-deploy
#      alembic revision is recorded.
#   2b. Migration-aware rollback — restoring images without restoring the schema
#      is not a rollback: the old image cannot locate the newer revision and
#      crash-loops (2026-09-29 outage). On failure we downgrade the schema back
#      to the snapshot revision first, using the NEW image, and only then
#      restore the images. If the downgrade is impossible the old images are
#      deliberately left alone and the stack stays on the new tag, because a
#      running-but-newer stack beats a guaranteed-dead one.
#   3. Migration applied via the compose `migrate` service (alembic upgrade head).
#      Note two CI-only requirements on every docker invocation here:
#        * `timeout --foreground` — plain `timeout` puts the child in a NEW
#          process group, so a docker CLI that writes to the terminal takes
#          SIGTTOU and is STOPPED, hanging the job forever (the exact thing the
#          timeout was added to prevent).
#        * `compose run -T` — never allocate a TTY in a CI job.
#   3b. Immutable tag pinning — compose.yaml resolves ${BACKEND_TAG} from
#      $DEPLOY_DIR/.env and this job pins it to the build sha. Floating :latest
#      was silently fatal: compose does not recreate a running service when a
#      floating tag moves, so deploys migrated the DB, passed the health-gate
#      against the PREVIOUS containers and reported success while the running
#      code never changed. Step 5b now asserts each container actually runs the
#      new tag.
#   4. Health-gate — waits for THREE signals: the api container healthcheck
#      (/health/live inside the container), a public GET /health/ready on :80
#      returning `"status":"ok"` (real DB + master-key check — a bare /health or
#      / could be answered by the SPA fallback even with a dead API, see
#      AUD-328), and :80 serving the SPA. Since AUD-388 all three are the same
#      container: `api` publishes :80 and serves the SPA itself.
#   5. Auto-rollback — any failure after the snapshot restores the previous
#      images and brings the stack back up.
#   6. Harbor :latest is only advanced AFTER the health-gate passes, so a failed
#      deploy never leaves a poisoned :latest in the registry.
#
# Triggers: push to main (guarded auto-deploy), release tags v*, and manual
# workflow_dispatch.
#
# The registry endpoint is NOT in this file: the GitHub repository is public, so
# it lives in the Gitea repository variable `AUDR_REGISTRY` (Settings → Actions →
# Variables) and the job refuses to start without it. The registry is anonymous —
# no docker login.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build & deploy (default: commit sha)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

# Never cancel a deploy in flight: a build-deploy job killed between the
# rollback snapshot and the health-gate would leave the stack half-changed with
# no one left to roll it back. Queue instead.
concurrency:
  group: audr-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AUDR_REGISTRY }}
  DEPLOY_DIR: /home/codex/audr

jobs:
  build-deploy:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      # Fail here rather than three steps in: an unset variable would otherwise
      # build and push `/audr-backend:<sha>` to Docker Hub's namespace resolution
      # and only blow up at the pull.
      - name: Check registry configuration
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "FATAL: repository variable AUDR_REGISTRY is not set"
            echo "       Set it under Settings -> Actions -> Variables (host:port of the image registry)."
            exit 2
          fi
          echo "registry = $REGISTRY"

      - name: Compute tags
        id: meta
        run: |
          sha="${GITHUB_SHA:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$sha" >> "$GITHUB_OUTPUT"
          fi

      # One image since AUD-388 — see the equivalent note in build.yaml.
      - name: Build image
        run: |
          set -euo pipefail
          docker build --target runtime \
            -t "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}" .

      - name: Push build tag to Harbor
        run: |
          set -euo pipefail
          docker push "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}"

      - name: Sync compose file to deploy dir
        run: |
          set -euo pipefail
          cp compose.yaml "$DEPLOY_DIR/compose.yaml"

      - name: Guarded deploy
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          # Both come from the workflow `env:` block above — REGISTRY from the
          # AUDR_REGISTRY repository variable, which the preflight step has
          # already proven non-empty.
          REGISTRY="${REGISTRY:?registry not configured}"
          DEPLOY_DIR="${DEPLOY_DIR:?deploy dir not configured}"
          BACKEND="$REGISTRY/audr-backend"
          HEALTH_RETRIES="${HEALTH_RETRIES:-40}"
          HEALTH_SLEEP="${HEALTH_SLEEP:-3}"
          log(){ echo "[deploy $(date -u +%FT%TZ)] $*"; }

          cd "$DEPLOY_DIR"

          # ---- 1. secrets preflight (NEVER regenerate) ----------------------
          log "Preflight in $DEPLOY_DIR (tag=$TAG)"
          [ -f .env ] || { log "FATAL: .env missing — refusing (would break DB auth)"; exit 2; }
          [ -f secrets/db_password.txt ] || { log "FATAL: secrets/db_password.txt missing"; exit 2; }
          grep -q '^DB_PASSWORD=' .env  || { log "FATAL: DB_PASSWORD missing in .env"; exit 2; }
          grep -q '^SECRET_KEY=' .env   || { log "FATAL: SECRET_KEY missing in .env"; exit 2; }

          # DB_PASSWORD is needed for the direct alembic invocations below.
          set -a; . ./.env; set +a

          # compose.yaml interpolates ${AUDR_REGISTRY} instead of hardcoding the
          # endpoint (the GitHub repo is public). Export it before the first
          # compose call — an exported value also wins over the .env file in
          # compose's precedence order — and persist it into $DEPLOY_DIR/.env
          # further down, so a manual `docker compose` on the host resolves the
          # same image instead of the localhost:5000 placeholder default.
          export AUDR_REGISTRY="$REGISTRY"

          # DB must be reachable before we touch the stack.
          timeout --foreground 180 docker compose up -d db
          for i in $(seq 1 20); do
            if docker compose exec -T db pg_isready -U audr -d audr >/dev/null 2>&1; then break; fi
            [ "$i" = 20 ] && { log "FATAL: db not ready"; exit 2; }
            sleep 2
          done
          log "db reachable"

          # ---- 2. rollback snapshot (images AND schema revision) -------------
          # The snapshot has two halves. Images alone are NOT a restorable
          # state: a deploy that migrates the DB and then fails leaves the
          # schema ahead of the old image, whose `alembic upgrade head` dies
          # with "Can't locate revision identified by '<new>'" — that is the
          # 2026-09-29 outage (stack down 2h18m). So we record the pre-deploy
          # alembic revision and roll the schema back too.
          alembic_rev(){
            docker compose exec -T db \
              psql -U audr -d audr -tAc 'select version_num from alembic_version' \
              2>/dev/null | tr -d '[:space:]' || true
          }
          PREV_REV="$(alembic_rev)"
          log "pre-deploy alembic revision = ${PREV_REV:-<none>}"

          # Image tags are pinned in $DEPLOY_DIR/.env, NOT floated through
          # :latest. `docker compose up -d` does not recreate a running service
          # just because a floating tag now resolves to a different image ID —
          # it compares the service *definition*. With `image: ...:latest` in
          # compose.yaml, every deploy retagged :latest, ran the migrations,
          # passed the health-gate against the OLD containers and reported
          # "Deploy OK" while the running code never changed. Pinning the tag
          # makes the definition change, so the recreate — and therefore the
          # health-gate — is real.
          env_get(){ sed -n "s/^$1=//p" .env | tail -1; }
          env_set(){
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
            # MUST also export: this script sources .env (for DB_PASSWORD), and
            # a variable exported in the environment WINS over the .env file in
            # compose's precedence order. Writing the file alone leaves compose
            # resolving the stale value and silently skipping the recreate.
            export "$1=$2"
          }
          env_set AUDR_REGISTRY "$REGISTRY"
          PREV_BACKEND_TAG="$(env_get BACKEND_TAG)";  PREV_BACKEND_TAG="${PREV_BACKEND_TAG:-latest}"
          log "pre-deploy pinned tag: backend=$PREV_BACKEND_TAG"

          if docker image inspect "$BACKEND:latest" >/dev/null 2>&1; then
            docker tag "$BACKEND:latest" "$BACKEND:rollback"
            log "snapshot $BACKEND:latest -> :rollback"
            # Push it: a host-local tag is lost to `docker image prune -a`,
            # disk-pressure GC or a host rebuild — exactly when we need it.
            docker push "$BACKEND:rollback" || log "warn: push $BACKEND:rollback failed (rollback is host-local only)"
          fi

          rollback(){
            log "!! FAILURE — rolling back"
            docker compose logs --no-color --tail=60 api    2>&1 | sed 's/^/[api] /'    || true
            docker compose logs --no-color --tail=30 migrate 2>&1 | sed 's/^/[migrate] /' || true

            # 2a. Schema first, while the pinned tag is still the NEW image —
            # it is the only image that knows how to downgrade its own
            # revisions. Once the old tag is restored it is too late.
            cur_rev="$(alembic_rev)"
            if [ -n "$PREV_REV" ] && [ -n "$cur_rev" ] && [ "$cur_rev" != "$PREV_REV" ]; then
              log "schema moved $PREV_REV -> $cur_rev; downgrading before restoring images"
              if timeout --foreground 300 docker compose run --rm -T --no-deps migrate \
                   python -m alembic downgrade "$PREV_REV"; then
                log "schema downgraded to $PREV_REV"
              else
                log "FATAL: cannot downgrade $cur_rev -> $PREV_REV (irreversible migration?)."
                log "NOT restoring the old images — they cannot boot against this schema."
                log "Leaving the stack on $TAG. Manual decision required (see this workflow's header)."
                timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: compose up after failed downgrade timed out"
                log "rollback ABORTED — stack is on $TAG at schema $cur_rev"
                return 0
              fi
            fi

            # 2b. Images: unpin back to the previously deployed tags.
            #
            # The pinned tag is what compose actually resolves, so that image
            # must be present locally or compose up dies mid-rollback. Do NOT
            # assume the host still has it: `docker image prune -a`, disk
            # -pressure GC or a host rebuild evicts it precisely when a
            # rollback is needed. Recover in order — local, then the immutable
            # per-sha tag in Harbor, then the :rollback tag we pushed in the
            # snapshot step. Only if all three miss is the rollback unarmed,
            # and then we say so loudly rather than failing silently.
            env_set BACKEND_TAG "$PREV_BACKEND_TAG"
            ROLLBACK_ARMED=1
            restore_image(){
              repo="$1"; want="$1:$2"
              if docker image inspect "$want" >/dev/null 2>&1; then
                log "rollback image $want present locally"
              elif docker pull "$want" >/dev/null 2>&1; then
                log "rollback image $want pulled from registry"
              elif docker pull "$repo:rollback" >/dev/null 2>&1; then
                docker tag "$repo:rollback" "$want"
                log "rollback image $want recovered from registry :rollback"
              else
                log "FATAL: no rollback image for $repo — not local, and neither $want nor $repo:rollback is in the registry"
                ROLLBACK_ARMED=0
                return 0
              fi
              docker tag "$want" "$repo:latest" || true
            }
            restore_image "$BACKEND" "$PREV_BACKEND_TAG"
            if [ "$ROLLBACK_ARMED" -eq 0 ]; then
              log "rollback ABORTED — previous images are unrecoverable; leaving the stack on $TAG."
              log "Manual decision required: rebuild the previous sha, or fix forward."
              timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: compose up timed out"
              return 0
            fi
            timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: rollback compose up timed out"
            log "rollback complete (backend=$PREV_BACKEND_TAG, schema at ${PREV_REV:-<none>})"
          }
          trap 'rollback; exit 1' ERR

          # ---- 3. pull new images, pin them, keep :latest as a human alias --
          log "Pulling $TAG"
          docker pull "$BACKEND:$TAG"
          env_set BACKEND_TAG "$TAG"
          log "pinned BACKEND_TAG=$TAG in $DEPLOY_DIR/.env"
          docker tag "$BACKEND:$TAG" "$BACKEND:latest"

          # ---- 4. migrations (alembic upgrade head) -------------------------
          log "Running migrations"
          timeout --foreground 600 docker compose run --rm -T migrate

          # ---- 5. deploy ----------------------------------------------------
          # Timeout is mandatory: `migrate` is a one-shot that `api`/`worker`
          # wait on with service_completed_successfully, so a failing one-shot
          # makes `compose up` block until someone kills it (2026-09-29 outage:
          # the job hung 2h18m and held the audr-deploy concurrency group, which
          # also starved every queued build). compose.yaml pins that service to
          # `restart: "no"` so it fails fast; this is the belt to that braces.
          log "Recreating services"
          timeout --foreground 300 docker compose up -d --remove-orphans

          # ---- 5b. assert the recreate really happened ---------------------
          # Without this, a deploy that fails to replace the containers still
          # sails through the health-gate — the gate would just be re-testing
          # the previous release.
          for c in audr-api-1 audr-worker-1; do
            want="$BACKEND:$TAG"
            running="$(docker inspect --format '{{.Config.Image}}' "$c" 2>/dev/null || echo none)"
            if [ "$running" != "$want" ]; then
              log "FATAL: $c runs $running, expected $want — the deploy did not replace the container"
              false
            fi
            log "$c -> $running"
          done

          # ---- 6. health-gate ----------------------------------------------
          # Three independent signals (AUD-328). The original gate paired the
          # api container healthcheck with `curl http://localhost:80/`, but
          # nginx proxied only `^/(api|health)/` (trailing slash) and served
          # index.html for everything else — so the :80 check passed even with
          # the api container dead, and contributed nothing. The public-path
          # signal is /health/ready (a real DB + master-key check) with a body
          # assertion, so an SPA response can never satisfy the gate.
          #
          # Since AUD-388 the SPA is served by the api container too, which
          # makes the `spa_code` signal load-bearing rather than decorative: a
          # 200 on / now additionally proves the image really contains the Vite
          # build at /app/static. An image built without it still starts and
          # still passes /health/ready — it just serves no UI — and / returns
          # 404, so this is the only signal that catches it. Do not drop it.
          log "Health-gate"
          ok=0
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            state="$(docker inspect --format '{{.State.Health.Status}}' audr-api-1 2>/dev/null || echo none)"
            ready="$(curl -s -m 5 http://localhost:80/health/ready 2>/dev/null || true)"
            spa_code="$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:80/ 2>/dev/null || echo 000)"
            case "$ready" in *'"status":"ok"'*) ready_ok=1 ;; *) ready_ok=0 ;; esac
            if [ "$state" = healthy ] && [ "$ready_ok" = 1 ] && [ "$spa_code" = 200 ]; then
              ok=1; log "healthy on attempt $i (api=$state ready=ok spa=$spa_code)"; break
            fi
            sleep "$HEALTH_SLEEP"
          done
          if [ "$ok" != 1 ]; then
            log "health-gate FAILED (api state=$state spa=$spa_code ready=${ready:-<none>})"
            docker compose ps || true
            false
          fi

          trap - ERR

          # ---- 7. advance Harbor :latest ONLY after health passes -----------
          docker push "$BACKEND:latest" || log "warn: push $BACKEND:latest failed"
          log "Deploy OK — tag=$TAG"

      # Every deploy mints a new per-sha image on this runner and nothing used
      # to remove them: by 2026-10-03 the host held 299 images + 3.8GB of build
      # cache at 89% of a 32GB root (AUD-395). Runs on failure paths too —
      # that is when the disk is most likely to be the actual cause — and the
      # retention window in host-gc.sh keeps the rollback image resident. See
      # that script's header for why pruning this host cannot disarm rollback.
      - name: Reclaim host disk
        if: always()
        run: bash scripts/host-gc.sh
