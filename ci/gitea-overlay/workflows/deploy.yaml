name: Build & Deploy (guarded)

# Guarded build + auto-deploy pipeline for the audr stack.
#
# One serialized job on the self-hosted `host` runner, which is also the deploy
# host. Build and deploy live in ONE job so ordering and image
# freshness are guaranteed — no cross-workflow race.
#
# The runner has capacity 2, so serialization does not come for free: two pushes
# to main could otherwise deploy concurrently against the same live stack, the
# same :rollback tag and the same registry :latest. The `concurrency` group
# below restores the guarantee explicitly and is shared with build.yaml, the
# other workflow that moves :latest.
#
# Safety guards:
#   1. Secrets preflight — refuses to deploy if ~/audr/.env is missing or has
#      no DB_PASSWORD/SECRET_KEY. The stack's DB password is fixed at DB init,
#      so a missing or regenerated credential means "password authentication
#      failed" against the live volume; hard-fail instead of proceeding.
#   2. Rollback snapshot — the currently-running :latest images are retagged
#      :rollback (and pushed to the registry, so the rollback path does not
#      depend on the host's local image cache surviving a prune), AND the
#      pre-deploy alembic revision is recorded.
#   2b. Migration-aware rollback — restoring images without restoring the schema
#      is not a rollback: the old image cannot locate the newer revision and
#      crash-loops. On failure we downgrade the schema back to the snapshot
#      revision first, using the NEW image, and only then restore the images. If
#      the downgrade is impossible the old images are deliberately left alone
#      and the stack stays on the new tag, because a running-but-newer stack
#      beats a guaranteed-dead one.
#   3. Migration applied via the compose `migrate` service (alembic upgrade head).
#      Note two CI-only requirements on every docker invocation here:
#        * `timeout --foreground` — plain `timeout` puts the child in a NEW
#          process group, so a docker CLI that writes to the terminal takes
#          SIGTTOU and is STOPPED, hanging the job forever (the exact thing the
#          timeout was added to prevent).
#        * `compose run -T` — never allocate a TTY in a CI job.
#   3b. Immutable tag pinning — the compose.deploy.yaml overlay resolves
#      ${BACKEND_TAG} from $DEPLOY_DIR/.env and this job pins it to the build
#      sha. A floating :latest is silently fatal: compose does not recreate a running service
#      when a floating tag moves, so a deploy migrates the DB, passes the
#      health-gate against the PREVIOUS containers and reports success while the
#      running code never changed. Step 5b asserts each container actually runs
#      the new tag.
#   4. Health-gate — waits for FOUR signals: the api container healthcheck
#      (/health/live inside the container), a public GET /health/ready on :80
#      returning `"status":"ok"` (a real DB + master-key check — a bare /health
#      or / could be answered by the SPA fallback even with a dead API), :80
#      serving the SPA, and GET /api/v1/version reporting the commit this job
#      built (the one signal a moved registry tag cannot fake). All four come
#      from the same container: `api` publishes :80 and serves the SPA itself.
#   5. Auto-rollback — any failure after the snapshot restores the previous
#      images and brings the stack back up.
#   6. The registry's :latest is only advanced AFTER the health-gate passes, so
#      a failed deploy never leaves a poisoned :latest behind.
#
# Triggers: push to main (guarded auto-deploy), release tags v*, and manual
# workflow_dispatch.
#
# The registry endpoint is NOT in this file: the GitHub repository is public, so
# it lives in the Gitea repository variable `AUDR_REGISTRY` (Settings → Actions →
# Variables) and the job refuses to start without it. The registry is anonymous —
# no docker login.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to build & deploy (default: commit sha)'
        required: false
        default: ''
  push:
    branches: [main]
    tags: ['v*']

# Never cancel a deploy in flight: a build-deploy job killed between the
# rollback snapshot and the health-gate would leave the stack half-changed with
# no one left to roll it back. Queue instead.
concurrency:
  group: audr-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AUDR_REGISTRY }}
  DEPLOY_DIR: /home/codex/audr

jobs:
  build-deploy:
    runs-on: host
    steps:
      - uses: actions/checkout@v4

      # Fail here rather than three steps in: an unset variable would otherwise
      # build and push `/audr-backend:<sha>` to Docker Hub's namespace resolution
      # and only blow up at the pull.
      - name: Check registry configuration
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "FATAL: repository variable AUDR_REGISTRY is not set"
            echo "       Set it under Settings -> Actions -> Variables (host:port of the image registry)."
            exit 2
          fi
          echo "registry = $REGISTRY"

      # Every image tag carries the semantic version from the repo-root
      # VERSION file, so a tag in the registry says what it is without
      # anyone having to resolve a sha against the git history.
      #
      #   push to main        -> <version>-g<sha>   (unique per commit)
      #   release tag v1.4.2  -> 1.4.2
      #   workflow_dispatch   -> whatever was typed, else <version>-g<sha>
      #
      # A `v*` ref whose name disagrees with VERSION is a hard failure, not a
      # warning: a v1.4.2 tag deploying an image that reports 1.4.1 makes every
      # later "what is on staging?" answer a lie, and the recovery costs more
      # the longer it survives. scripts/release.sh cannot produce that state.
      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"
          version="$(tr -d ' \t\r\n' < VERSION)"
          release=0
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "FATAL: release tag ${GITHUB_REF_NAME} does not match VERSION (${version})."
              echo "       Cut releases with scripts/release.sh, which keeps the two in step."
              exit 2
            fi
            tag="$version"
            release=1
          elif [ -n "${{ github.event.inputs.image_tag }}" ]; then
            tag="${{ github.event.inputs.image_tag }}"
          else
            tag="${version}-g${sha}"
          fi
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "version=$version tag=$tag release=$release"

      # One image only — see the equivalent note in build.yaml.
      - name: Build image
        run: |
          set -euo pipefail
          docker build --target runtime \
            --build-arg "AUDR_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "AUDR_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "AUDR_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}" .

      - name: Push build tag to Harbor
        run: |
          set -euo pipefail
          docker push "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}"

      - name: Sync compose files to deploy dir
        run: |
          set -euo pipefail
          # Both files: compose.yaml alone pulls the public ghcr.io release,
          # compose.deploy.yaml is the overlay that redirects the three backend
          # services at $AUDR_REGISTRY/$BACKEND_TAG.
          cp compose.yaml compose.deploy.yaml "$DEPLOY_DIR/"

      - name: Guarded deploy
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE: ${{ steps.meta.outputs.release }}
          # Bound explicitly rather than read from $GITHUB_SHA inside the
          # script: the health-gate compares against it, and an empty value
          # would turn every deploy into a failed gate and an automatic
          # rollback — a pipeline-wide outage caused by a missing variable.
          # The preflight below refuses to start instead.
          EXPECT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Both come from the workflow `env:` block above — REGISTRY from the
          # AUDR_REGISTRY repository variable, which the preflight step has
          # already proven non-empty.
          REGISTRY="${REGISTRY:?registry not configured}"
          DEPLOY_DIR="${DEPLOY_DIR:?deploy dir not configured}"
          BACKEND="$REGISTRY/audr-backend"
          HEALTH_RETRIES="${HEALTH_RETRIES:-40}"
          HEALTH_SLEEP="${HEALTH_SLEEP:-3}"
          log(){ echo "[deploy $(date -u +%FT%TZ)] $*"; }

          cd "$DEPLOY_DIR"

          # ---- 1. secrets preflight (NEVER regenerate) ----------------------
          log "Preflight in $DEPLOY_DIR (tag=$TAG version=${VERSION:-?})"
          [ -n "${EXPECT_COMMIT:-}" ] || { log "FATAL: EXPECT_COMMIT empty — the health-gate could never pass"; exit 2; }
          [ -f .env ] || { log "FATAL: .env missing — refusing (would break DB auth)"; exit 2; }
          grep -q '^DB_PASSWORD=' .env  || { log "FATAL: DB_PASSWORD missing in .env"; exit 2; }
          grep -q '^SECRET_KEY=' .env   || { log "FATAL: SECRET_KEY missing in .env"; exit 2; }

          # DB_PASSWORD is needed for the direct alembic invocations below.
          set -a; . ./.env; set +a

          # compose.yaml pulls the public ghcr.io/br3d release; this host pulls
          # from the private registry instead, which is what the
          # compose.deploy.yaml overlay is for. All three are exported before
          # the first compose call — an exported value also wins over the .env
          # file in compose's precedence order — and persisted into
          # $DEPLOY_DIR/.env further down, so a manual `docker compose` on the
          # host resolves the same images this job deployed.
          export COMPOSE_FILE="compose.yaml:compose.deploy.yaml"
          export AUDR_REGISTRY="$REGISTRY"
          # BACKEND_TAG too, and this early: compose interpolates every
          # service's `image:` when it loads the project — even for `up -d db`
          # below — and the overlay requires the variable rather than defaulting
          # it. The *pre-deploy* tag for the rollback snapshot is read out of
          # .env with env_get, so exporting the new one here does not hide it.
          export BACKEND_TAG="$TAG"

          # Assert the overlay actually took effect before anything touches the
          # DB. Every variable above can be set correctly and still resolve to
          # the public image — e.g. if compose.deploy.yaml never made it into
          # $DEPLOY_DIR, which is exactly how AUD-443 happened: a stale host
          # overlay copied compose.yaml alone, the three backend services
          # silently resolved to ghcr.io/br3d/audr-backend:0.1.1, and `migrate`
          # then died on a revision that old image had never heard of. Health
          # gates cannot catch it — by then the stack is already down. This can,
          # in one second, before the first destructive step.
          for f in compose.yaml compose.deploy.yaml; do
            [ -f "$f" ] || { log "FATAL: $f missing in $DEPLOY_DIR — overlay not synced"; exit 2; }
          done
          resolved="$(docker compose config --images | sort -u)"
          log "resolved images:"; printf '%s\n' "$resolved" | sed 's/^/    /'
          # Every audr-backend reference must be the tag this job just built in
          # the private registry. Anything else — public ghcr.io, a floating
          # :latest, a stale tag — is a deploy that would not ship this build.
          if printf '%s\n' "$resolved" | grep 'audr-backend' | grep -qv "^${REGISTRY}/audr-backend:${TAG}$"; then
            log "FATAL: compose resolved a backend image that is not ${REGISTRY}/audr-backend:${TAG}"
            log "       the compose.deploy.yaml overlay did not take effect — refusing to deploy"
            exit 2
          fi
          printf '%s\n' "$resolved" | grep -q "^${REGISTRY}/audr-backend:${TAG}$" \
            || { log "FATAL: ${REGISTRY}/audr-backend:${TAG} absent from resolved images"; exit 2; }
          log "overlay verified: backend services pinned to ${REGISTRY}/audr-backend:${TAG}"

          # DB must be reachable before we touch the stack.
          timeout --foreground 180 docker compose up -d db
          for i in $(seq 1 20); do
            if docker compose exec -T db pg_isready -U audr -d audr >/dev/null 2>&1; then break; fi
            [ "$i" = 20 ] && { log "FATAL: db not ready"; exit 2; }
            sleep 2
          done
          log "db reachable"

          # ---- 2. rollback snapshot (images AND schema revision) -------------
          # The snapshot has two halves. Images alone are NOT a restorable
          # state: a deploy that migrates the DB and then fails leaves the
          # schema ahead of the old image, whose `alembic upgrade head` dies
          # with "Can't locate revision identified by '<new>'" — a rollback that
          # cannot start. So record the pre-deploy alembic revision and roll the
          # schema back too.
          alembic_rev(){
            docker compose exec -T db \
              psql -U audr -d audr -tAc 'select version_num from alembic_version' \
              2>/dev/null | tr -d '[:space:]' || true
          }
          PREV_REV="$(alembic_rev)"
          log "pre-deploy alembic revision = ${PREV_REV:-<none>}"

          # Image tags are pinned in $DEPLOY_DIR/.env, NOT floated through
          # :latest. `docker compose up -d` does not recreate a running service
          # just because a floating tag now resolves to a different image ID —
          # it compares the service *definition*. Back when the deployed image
          # was `...:latest`, every deploy retagged :latest, ran the migrations,
          # passed the health-gate against the OLD containers and reported
          # "Deploy OK" while the running code never changed. Pinning the tag
          # makes the definition change, so the recreate — and therefore the
          # health-gate — is real.
          env_get(){ sed -n "s/^$1=//p" .env | tail -1; }
          env_set(){
            if grep -q "^$1=" .env; then
              sed -i "s|^$1=.*|$1=$2|" .env
            else
              printf '%s=%s\n' "$1" "$2" >> .env
            fi
            # MUST also export: this script sources .env (for DB_PASSWORD), and
            # a variable exported in the environment WINS over the .env file in
            # compose's precedence order. Writing the file alone leaves compose
            # resolving the stale value and silently skipping the recreate.
            export "$1=$2"
          }
          env_set COMPOSE_FILE "compose.yaml:compose.deploy.yaml"
          env_set AUDR_REGISTRY "$REGISTRY"
          PREV_BACKEND_TAG="$(env_get BACKEND_TAG)";  PREV_BACKEND_TAG="${PREV_BACKEND_TAG:-latest}"
          log "pre-deploy pinned tag: backend=$PREV_BACKEND_TAG"

          if docker image inspect "$BACKEND:latest" >/dev/null 2>&1; then
            docker tag "$BACKEND:latest" "$BACKEND:rollback"
            log "snapshot $BACKEND:latest -> :rollback"
            # Push it: a host-local tag is lost to `docker image prune -a`,
            # disk-pressure GC or a host rebuild — exactly when we need it.
            docker push "$BACKEND:rollback" || log "warn: push $BACKEND:rollback failed (rollback is host-local only)"
          fi

          rollback(){
            log "!! FAILURE — rolling back"
            docker compose logs --no-color --tail=60 api    2>&1 | sed 's/^/[api] /'    || true
            docker compose logs --no-color --tail=30 migrate 2>&1 | sed 's/^/[migrate] /' || true

            # 2a. Schema first, while the pinned tag is still the NEW image —
            # it is the only image that knows how to downgrade its own
            # revisions. Once the old tag is restored it is too late.
            cur_rev="$(alembic_rev)"
            if [ -n "$PREV_REV" ] && [ -n "$cur_rev" ] && [ "$cur_rev" != "$PREV_REV" ]; then
              log "schema moved $PREV_REV -> $cur_rev; downgrading before restoring images"
              if timeout --foreground 300 docker compose run --rm -T --no-deps migrate \
                   python -m alembic downgrade "$PREV_REV"; then
                log "schema downgraded to $PREV_REV"
              else
                log "FATAL: cannot downgrade $cur_rev -> $PREV_REV (irreversible migration?)."
                log "NOT restoring the old images — they cannot boot against this schema."
                log "Leaving the stack on $TAG. Manual decision required (see this workflow's header)."
                timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: compose up after failed downgrade timed out"
                log "rollback ABORTED — stack is on $TAG at schema $cur_rev"
                return 0
              fi
            fi

            # 2b. Images: unpin back to the previously deployed tags.
            #
            # The pinned tag is what compose actually resolves, so that image
            # must be present locally or compose up dies mid-rollback. Do NOT
            # assume the host still has it: `docker image prune -a`, disk
            # -pressure GC or a host rebuild evicts it precisely when a
            # rollback is needed. Recover in order — local, then the immutable
            # per-sha tag in Harbor, then the :rollback tag we pushed in the
            # snapshot step. Only if all three miss is the rollback unarmed,
            # and then we say so loudly rather than failing silently.
            env_set BACKEND_TAG "$PREV_BACKEND_TAG"
            ROLLBACK_ARMED=1
            restore_image(){
              repo="$1"; want="$1:$2"
              if docker image inspect "$want" >/dev/null 2>&1; then
                log "rollback image $want present locally"
              elif docker pull "$want" >/dev/null 2>&1; then
                log "rollback image $want pulled from registry"
              elif docker pull "$repo:rollback" >/dev/null 2>&1; then
                docker tag "$repo:rollback" "$want"
                log "rollback image $want recovered from registry :rollback"
              else
                log "FATAL: no rollback image for $repo — not local, and neither $want nor $repo:rollback is in the registry"
                ROLLBACK_ARMED=0
                return 0
              fi
              docker tag "$want" "$repo:latest" || true
            }
            restore_image "$BACKEND" "$PREV_BACKEND_TAG"
            if [ "$ROLLBACK_ARMED" -eq 0 ]; then
              log "rollback ABORTED — previous images are unrecoverable; leaving the stack on $TAG."
              log "Manual decision required: rebuild the previous sha, or fix forward."
              timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: compose up timed out"
              return 0
            fi
            timeout --foreground 300 docker compose up -d --remove-orphans || log "warn: rollback compose up timed out"
            log "rollback complete (backend=$PREV_BACKEND_TAG, schema at ${PREV_REV:-<none>})"
          }
          trap 'rollback; exit 1' ERR

          # ---- 3. pull new images, pin them, keep :latest as a human alias --
          log "Pulling $TAG"
          docker pull "$BACKEND:$TAG"
          env_set BACKEND_TAG "$TAG"
          log "pinned BACKEND_TAG=$TAG in $DEPLOY_DIR/.env"
          docker tag "$BACKEND:$TAG" "$BACKEND:latest"

          # ---- 4. migrations (alembic upgrade head) -------------------------
          log "Running migrations"
          timeout --foreground 600 docker compose run --rm -T migrate

          # ---- 5. deploy ----------------------------------------------------
          # Timeout is mandatory: `migrate` is a one-shot that `api`/`worker`
          # wait on with service_completed_successfully, so a failing one-shot
          # makes `compose up` block until someone kills it — and a hung job
          # holds the audr-deploy concurrency group, starving every queued
          # build behind it. compose.yaml pins that service to `restart: "no"`
          # so it fails fast; this is the belt to that braces.
          log "Recreating services"
          timeout --foreground 300 docker compose up -d --remove-orphans

          # ---- 5b. assert the recreate really happened ---------------------
          # Without this, a deploy that fails to replace the containers still
          # sails through the health-gate — the gate would just be re-testing
          # the previous release.
          for c in audr-api-1 audr-worker-1; do
            want="$BACKEND:$TAG"
            running="$(docker inspect --format '{{.Config.Image}}' "$c" 2>/dev/null || echo none)"
            if [ "$running" != "$want" ]; then
              log "FATAL: $c runs $running, expected $want — the deploy did not replace the container"
              false
            fi
            log "$c -> $running"
          done

          # ---- 6. health-gate ----------------------------------------------
          # Four independent signals, none of which is decorative.
          #
          # The public-path signal must be /health/ready (a real DB + master-key
          # check) WITH a body assertion: a plain `curl http://localhost:80/`
          # can be answered by the SPA fallback even with the API dead, so it
          # would prove nothing.
          #
          # `spa_code` is load-bearing because the api container serves the SPA
          # too: a 200 on / proves the image really contains the Vite build at
          # /app/static. An image built without it still starts and still passes
          # /health/ready — it just serves no UI — and / returns 404, so this is
          # the only signal that catches it. Do not drop it.
          #
          # GET /api/v1/version must report the commit this job just built.
          # Step 5b already asserts the container
          # runs the expected *image tag*, but a tag is metadata the registry
          # can be talked into moving; the commit sha is baked into the image at
          # build time, so this is the one check that compares what is running
          # against what this job compiled. It is also what makes the semantic
          # version in the sidebar trustworthy — nothing is "deployed" until the
          # running build admits to being the right one.
          log "Health-gate"
          ok=0
          for i in $(seq 1 "$HEALTH_RETRIES"); do
            state="$(docker inspect --format '{{.State.Health.Status}}' audr-api-1 2>/dev/null || echo none)"
            ready="$(curl -s -m 5 http://localhost:80/health/ready 2>/dev/null || true)"
            spa_code="$(curl -s -m 5 -o /dev/null -w '%{http_code}' http://localhost:80/ 2>/dev/null || echo 000)"
            ver="$(curl -s -m 5 http://localhost:80/api/v1/version 2>/dev/null || true)"
            case "$ready" in *'"status":"ok"'*) ready_ok=1 ;; *) ready_ok=0 ;; esac
            case "$ver" in *"\"commit\":\"${EXPECT_COMMIT}\""*) ver_ok=1 ;; *) ver_ok=0 ;; esac
            if [ "$state" = healthy ] && [ "$ready_ok" = 1 ] && [ "$spa_code" = 200 ] && [ "$ver_ok" = 1 ]; then
              ok=1; log "healthy on attempt $i (api=$state ready=ok spa=$spa_code version=$ver)"; break
            fi
            sleep "$HEALTH_SLEEP"
          done
          if [ "$ok" != 1 ]; then
            log "health-gate FAILED (api state=$state spa=$spa_code ready=${ready:-<none>} version=${ver:-<none>})"
            log "expected commit ${EXPECT_COMMIT}"
            docker compose ps || true
            false
          fi

          trap - ERR

          # ---- 7. advance Harbor :latest ONLY after health passes -----------
          docker push "$BACKEND:latest" || log "warn: push $BACKEND:latest failed"
          # A release ref additionally publishes the bare `:<version>` tag, and
          # only from here: a version tag that appears before the health-gate
          # would name an image nobody has proven can serve traffic. On a
          # non-release push RELEASE is 0 and nothing extra is published, so
          # `:1.4.2` keeps meaning the 1.4.2 release rather than "latest build
          # that happened while VERSION said 1.4.2".
          if [ "${RELEASE:-0}" = 1 ]; then
            docker tag "$BACKEND:$TAG" "$BACKEND:$VERSION"
            docker push "$BACKEND:$VERSION" || log "warn: push $BACKEND:$VERSION failed"
            log "published release tag $BACKEND:$VERSION"
          fi
          log "Deploy OK — tag=$TAG version=$VERSION"

      # A deploy reporting `failure` is not the same as anyone knowing the stand
      # is down, and the two are not even correlated: most failures above happen
      # before anything destructive, or end with a rollback that leaves a
      # serving stack. AUD-443 was the other kind. Run 447 reported failure
      # correctly, the rollback could not recover (it resolved images through
      # the same broken compose), and the stand sat with nothing but Postgres
      # for two hours because no step after the failing one ever said so. The
      # job log ended at "migrate exited 255" — true, and no help.
      #
      # This step closes that gap as far as a workflow can: on every failure it
      # states, in one unmissable line, whether the stand is actually serving.
      # "deploy failed, stand still serving the previous release" and "deploy
      # failed, THE STAND IS DOWN" are the same red X today, and they call for
      # very different responses at very different speeds.
      #
      # It deliberately does not try to repair anything — a second automatic
      # recovery attempt layered on a rollback that already failed is how a bad
      # deploy becomes a bad database. It reports; a human decides.
      #
      # Exits 0: the job is already failed by the step that brought us here, and
      # exiting non-zero would only replace that step's diagnosis with this
      # one's in the run summary.
      - name: Report stand state (failure path)
        if: failure()
        run: |
          set -uo pipefail
          ready="$(curl -s -m 5 http://localhost:80/health/ready 2>/dev/null || true)"
          # Two steps rather than `|| echo absent`: a failing docker inspect
          # still writes an empty line to stdout, so the one-liner yields
          # "\nabsent" and splits the value across two lines in the alert body.
          api="$(docker inspect --format '{{.State.Status}}' audr-api-1 2>/dev/null)" || api=""
          api="${api:-absent}"
          case "$ready" in
            *'"status":"ok"'*)
              echo "::warning title=Deploy failed, stand still serving::$ready"
              echo "[stand] deploy FAILED but the stand is serving (api=$api) — no outage, investigate at human speed"
              ;;
            *)
              echo "::error title=Deploy failed AND THE STAND IS DOWN::api container is '$api' and /health/ready did not report ok"
              echo "[stand] ############################################################"
              echo "[stand] DEPLOY FAILED AND THE STAND IS DOWN — audr is not serving."
              echo "[stand] api container state : $api"
              echo "[stand] /health/ready       : ${ready:-<no response>}"
              echo "[stand] Recovery: docs/deploy-runbook.md, 'Stand down after a failed deploy'."
              echo "[stand] ############################################################"
              # Push the alert out of the run log and onto the board (AUD-444).
              # Everything above only reaches someone already looking at this
              # run, which in AUD-443 was nobody for two hours.
              #
              # No threshold and no debounce, unlike the host watchdog: a deploy
              # that has just finished and left /health/ready not-ok is a
              # confirmed outage, not a probe that might be a restart in flight.
              #
              # notify.sh exits 0 both when no channel is configured and when
              # delivery fails, so this cannot replace the diagnosis above with
              # an alerting error of its own. It reads its credentials from
              # $DEPLOY_DIR/secrets/ — the same files the host watchdog uses —
              # so nothing secret appears in this public workflow, and there is
              # no Gitea secret to rotate separately.
              #
              # --key deploy-failed is deliberately NOT the watchdog's
              # stand-down key. Consecutive failed deploys belong in one board
              # issue, but they must not be folded into an unrelated
              # spontaneous outage: the two have different first questions.
              AUDR_REMOTE_DIR="$DEPLOY_DIR" bash scripts/notify.sh --key deploy-failed -- "$(printf '%s\n' \
                "🔴 audr stand DOWN after a failed deploy" \
                "" \
                "Deploy of ${GITHUB_SHA:0:12} failed and the stand is NOT serving." \
                "api           : ${api}" \
                "/health/ready : ${ready:-<no response>}" \
                "run           : #${GITHUB_RUN_NUMBER:-?} of ${GITHUB_REPOSITORY:-audr} (${GITHUB_REF_NAME:-?})" \
                "" \
                "Runbook: docs/deploy-runbook.md — 'Stand down after a failed deploy'.")" || true
              ;;
          esac
          # Unconditional, both paths: this is the state a responder needs first
          # and it is cheap. Never let it fail the step.
          cd "$DEPLOY_DIR" 2>/dev/null && docker compose ps || true
          exit 0

      # The other half of the failure path above. Without this, the `critical`
      # board issue a failed deploy opens outlives the problem: the fix lands,
      # the stand serves, and the issue sits there until a human notices it is
      # stale. An alert channel that needs manual cleanup gets muted, which is
      # the failure mode AUD-444 exists to avoid.
      #
      # --resolve against a key with nothing open is a no-op that exits 0, so
      # this is silent after the overwhelming majority of deploys (the ones not
      # preceded by a failure) and costs one state-file stat.
      - name: Clear deploy-failure alert (success path)
        if: success()
        run: |
          set -uo pipefail
          AUDR_REMOTE_DIR="$DEPLOY_DIR" bash scripts/notify.sh --key deploy-failed --resolve -- "$(printf '%s\n' \
            "✅ audr deploy RECOVERED" \
            "" \
            "Deploy of ${GITHUB_SHA:0:12} succeeded and the stand is serving." \
            "run           : #${GITHUB_RUN_NUMBER:-?} of ${GITHUB_REPOSITORY:-audr} (${GITHUB_REF_NAME:-?})" \
            "" \
            "Closing the alert opened by the earlier failed deploy. No action needed.")" || true
          exit 0

      # Every deploy mints a new per-sha image on this runner, and left
      # unattended they fill the root filesystem — hundreds of images plus
      # several GB of build cache. Runs on failure paths too (that is when the
      # disk is most likely to be the actual cause), and the retention window in
      # host-gc.sh keeps the rollback image resident. See that script's header
      # for why pruning this host cannot disarm rollback.
      - name: Reclaim host disk
        if: always()
        run: bash scripts/host-gc.sh

      # Registry-side counterpart of the step above. Every deploy also mints a
      # registry tag, and a hand-run pruner is a policy nobody enforces.
      # Running it here is what makes the retention rules in
      # scripts/registry-prune.py an actual policy rather than a documented one.
      #
      # Deliberately NOT `if: always()`, unlike host-gc. On a failed deploy the
      # stack has just been rolled back and :rollback is the only thing standing
      # between us and an outage; that is the worst possible moment to delete
      # anything from the registry, and no disk pressure is relieved by doing so
      # anyway (see below). `success()` is the implicit default and skips this
      # step whenever any earlier step failed.
      #
      # Runs on the deploy host, so the default --env-file (/home/codex/audr/.env)
      # is the real one the live stack resolves ${BACKEND_TAG} from, and the
      # currently-deployed tag is therefore protected from the inside rather than
      # by a --protect we would have to remember to pass. The step runs after the
      # guarded deploy has already pinned that .env to this build's tag.
      #
      # Exits 0 unconditionally: a retention problem is disk hygiene on a healthy
      # deploy and must never turn a green deploy red. A failure is logged for
      # someone to pick up later.
      #
      # NOTE this reclaims no bytes on its own. A /v2 manifest delete only unlinks
      # the tag; the blobs are freed solely by `registry garbage-collect` on the
      # registry host, which we have no shell for.
      - name: Enforce registry tag retention
        env:
          AUDR_REGISTRY: ${{ vars.AUDR_REGISTRY }}
        run: |
          python3 scripts/registry-prune.py --apply || {
            echo "[registry-prune] FAILED (exit $?) — retention not enforced this deploy; deploy itself is unaffected"
          }
          exit 0
