name: Build & Push Images

# Manual dispatch only, with no push trigger: publishing images is the deploy
# pipeline's job (deploy.yaml, on `v*` tags), and an unattended build from main
# would move `:latest` in the registry without any health-gate behind it. The
# registry is anonymous (no login); its endpoint comes from the Gitea repository
# variable AUDR_REGISTRY, not from this file.
on:
  workflow_dispatch:

# Shares deploy.yaml's group: this workflow moves the registry's `:latest`, so a
# manual dispatch must not overlap a guarded deploy that is snapshotting or
# advancing the same tag.
concurrency:
  group: audr-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AUDR_REGISTRY }}

jobs:
  build-push:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Check registry configuration
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "FATAL: repository variable AUDR_REGISTRY is not set"
            echo "       Set it under Settings -> Actions -> Variables (host:port of the image registry)."
            exit 2
          fi
          echo "registry = $REGISTRY"
      # Same `<version>-g<sha>` scheme as deploy.yaml, so a manual dispatch and
      # an automatic deploy leave tags of the same shape in the registry.
      # This workflow never publishes a bare `:<version>` tag — that
      # one is reserved for a release that has passed deploy.yaml's health-gate.
      - name: Compute tags
        id: meta
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA:0:12}"
          version="$(tr -d ' \t\r\n' < VERSION)"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=${version}-g${sha}"
          } >> "$GITHUB_OUTPUT"
      # One image only: the `runtime` stage contains the Vite build at
      # /app/static and the API serves the SPA itself. The frontend is still
      # built — in the `frontend-builder` stage that `runtime` copies from.
      - name: Build backend image
        run: |
          docker build --target runtime \
            --build-arg "AUDR_VERSION=${{ steps.meta.outputs.version }}" \
            --build-arg "AUDR_GIT_SHA=${GITHUB_SHA}" \
            --build-arg "AUDR_BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}" \
            -t "$REGISTRY/audr-backend:latest" .
      - name: Push images
        run: |
          docker push "$REGISTRY/audr-backend:${{ steps.meta.outputs.tag }}"
          docker push "$REGISTRY/audr-backend:latest"
      # Same host runner, same image accumulation as deploy.yaml.
      - name: Reclaim host disk
        if: always()
        run: bash scripts/host-gc.sh
