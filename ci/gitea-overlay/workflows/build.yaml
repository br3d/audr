name: Build & Push Images

# DISABLED auto-trigger (AUD-294 incident 2026-09-28): the deployed code on the
# deploy host (~/audr @ 9ae03b6, migration 008) was NOT committed to this repo's
# main (stopped at 007), so builds from main produced STALE images that broke the
# DB schema on deploy. Manual dispatch only until the deployed code is
# reconciled into git. The registry is anonymous (no login); its endpoint comes
# from the Gitea repository variable AUDR_REGISTRY, not from this file.
on:
  workflow_dispatch:

# Shares deploy.yaml's group: this workflow moves Harbor :latest, so a manual
# dispatch must not overlap a guarded deploy that is snapshotting/advancing the
# same tag. See AUD-310.
concurrency:
  group: audr-deploy
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.AUDR_REGISTRY }}

jobs:
  build-push:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
      - name: Check registry configuration
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY:-}" ]; then
            echo "FATAL: repository variable AUDR_REGISTRY is not set"
            echo "       Set it under Settings -> Actions -> Variables (host:port of the image registry)."
            exit 2
          fi
          echo "registry = $REGISTRY"
      - name: Compute tags
        id: meta
        run: |
          echo "sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "version=latest" >> "$GITHUB_OUTPUT"
      # One image since AUD-388: the `runtime` stage contains the Vite build at
      # /app/static and the API serves the SPA itself, so the separate
      # nginx-based `audr-frontend` image is gone. The frontend is still built —
      # in the `frontend-builder` stage that `runtime` copies from.
      - name: Build backend image
        run: |
          docker build --target runtime \
            -t "$REGISTRY/audr-backend:${{ steps.meta.outputs.sha }}" \
            -t "$REGISTRY/audr-backend:${{ steps.meta.outputs.version }}" .
      - name: Push images
        run: |
          docker push "$REGISTRY/audr-backend:${{ steps.meta.outputs.sha }}"
          docker push "$REGISTRY/audr-backend:${{ steps.meta.outputs.version }}"
      # Same host runner, same image accumulation as deploy.yaml (AUD-395).
      - name: Reclaim host disk
        if: always()
        run: bash scripts/host-gc.sh
