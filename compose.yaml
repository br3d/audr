name: audr

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # Single one-shot bootstrap: schema migration, then master-key init.
  #
  # These were two services (`migrate` + `init`) until AUD-386. Both ran the
  # same image against the same database and `init_key` is idempotent by
  # design ("safe to call on every startup"), so the split bought nothing but
  # an extra compose service and an extra container start per deploy. Order
  # still matters — `init_key` writes to `key_state`, which the 0001 baseline
  # migration creates — hence `&&` rather than two parallel commands.
  migrate:
    image: 192.168.1.90:8085/audr-backend:${BACKEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # One-shot. Must NOT restart: `api`/`worker` wait on it with
    # service_completed_successfully, so an unbounded `restart: on-failure`
    # turns a failed migration into a `docker compose up` that blocks forever
    # instead of an error (2026-09-29 outage: the deploy job hung 2h18m mid
    # rollback and held the audr-deploy lock). Fail fast, let the deploy roll back.
    restart: "no"

  api:
    image: 192.168.1.90:8085/audr-backend:${BACKEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port in the project. There used to be an nginx `web`
    # service in front of this one, serving the SPA on :80 and reverse-proxying
    # /api and /health here; AUD-388 folded that into the API process, which now
    # serves the built bundle out of /app/static. See docs/containers.md.
    ports:
      - "80:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: 192.168.1.90:8085/audr-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  db_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  internal:
    driver: bridge
