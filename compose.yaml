name: audr

# ${AUDR_REGISTRY} is the registry holding the audr-backend image. It is not
# baked in because this repository is public: set it in the deploy directory's
# .env (scripts/deploy.sh and the CI deploy job both pin it there alongside
# BACKEND_TAG) or export it before running compose. The localhost:5000 default
# is a placeholder for a local `docker run -p 5000:5000 registry:2` — for plain
# local development use `docker compose up --build`, which builds the image from
# the `build:` stanzas below and never consults a registry at all.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # Single one-shot bootstrap: schema migration, then master-key init.
  #
  # These were two services (`migrate` + `init`) until AUD-386. Both ran the
  # same image against the same database and `init_key` is idempotent by
  # design ("safe to call on every startup"), so the split bought nothing but
  # an extra compose service and an extra container start per deploy. Order
  # still matters — `init_key` writes to `key_state`, which the 0001 baseline
  # migration creates — hence `&&` rather than two parallel commands.
  migrate:
    image: ${AUDR_REGISTRY:-localhost:5000}/audr-backend:${BACKEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # One-shot. Must NOT restart: `api`/`worker` wait on it with
    # service_completed_successfully, so an unbounded `restart: on-failure`
    # turns a failed migration into a `docker compose up` that blocks forever
    # instead of an error (2026-09-29 outage: the deploy job hung 2h18m mid
    # rollback and held the audr-deploy lock). Fail fast, let the deploy roll back.
    restart: "no"

  api:
    image: ${AUDR_REGISTRY:-localhost:5000}/audr-backend:${BACKEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port in the project. There used to be an nginx `web`
    # service in front of this one, serving the SPA on :80 and reverse-proxying
    # /api and /health here; AUD-388 folded that into the API process, which now
    # serves the built bundle out of /app/static. See docs/containers.md.
    ports:
      - "80:8000"
    # Deliberately stdlib-Python and not `curl` (AUD-379): the image is
    # digest-pinned everywhere else, and installing curl via apt was the one
    # unpinned element in it. urllib raises on a connection failure and on any
    # 4xx/5xx, so a non-zero exit covers every failure mode `curl -f` did.
    # The except clause is not optional: letting the exception escape writes a
    # ~2KB traceback into `.State.Health.Log`, and Docker keeps only the last 5
    # entries at 4KB each, so the useful history gets crowded out. Printing the
    # exception gives one readable line ("[Errno 111] Connection refused").
    # The deploy health-gate reads `.State.Health.Status` of audr-api-1, so
    # this check is load-bearing — see ci/gitea-overlay/workflows/deploy.yaml.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health/live", timeout=4).status == 200 else 1)
          except Exception as exc:
              print(exc)
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: ${AUDR_REGISTRY:-localhost:5000}/audr-backend:${BACKEND_TAG:-latest}
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  db_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  internal:
    driver: bridge
