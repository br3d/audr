name: audr

# Installs the published release. Two commands, nothing to fill in:
#
#     bash scripts/setup-secrets.sh   # generates DB_PASSWORD and SECRET_KEY in .env
#     docker compose up -d
#
# The version you run is the image tag below, and it moves with the repo:
# `git pull && docker compose pull && docker compose up -d` upgrades you. To
# stay on an older release, check out its tag (`git checkout v0.1.0`) — the tag
# here always matches the checkout.
#
# Building from source instead:  docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Deploying from a private registry:  see compose.deploy.yaml

x-backend-image: &backend_image ghcr.io/br3d/audr-backend:0.1.1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      # Generated into .env by scripts/setup-secrets.sh, like every other
      # credential here; the DATABASE_URLs below embed the same value.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is unset - run `bash scripts/setup-secrets.sh`}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # One-shot bootstrap: schema migration, then master-key init. `&&` because
  # init_key writes to a table the migration creates. `restart: "no"` because
  # api/worker wait on it exiting 0 — retrying would hang `up` forever instead
  # of failing. See docs/containers.md.
  migrate:
    image: *backend_image
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: *backend_image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port: this one process serves /api, /health and the
    # SPA. Set AUDR_HTTP_PORT in .env if :80 is already taken on your host —
    # only the host side moves, the container always listens on 8000.
    ports:
      - "${AUDR_HTTP_PORT:-80}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "audr.operations.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: *backend_image
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
