name: audr

# Out of the box this stack pulls the public release image
#
#     ghcr.io/br3d/audr-backend:0.1.1
#
# and nothing else from a registry (`postgres:16-alpine` aside). The default is
# spelled out rather than hidden behind a variable so that you can see what your
# machine is about to download before you run `docker compose up`. The
# version moves with the repo: scripts/release.sh rewrites it here together with
# the other version carriers, so a checkout of tag v0.4.1 pulls :0.4.1.
#
# Two overrides exist for operators who run their own registry — the deploy host
# does, which is why they stay variables:
#
#   AUDR_REGISTRY  registry and namespace, e.g. registry.internal:5000
#   BACKEND_TAG    image tag, e.g. 0.4.1-g1a2b3c4d5e6f
#
# scripts/deploy.sh and the CI deploy job pin both in the deploy directory's
# .env. For local development use `docker compose up --build`, which builds the
# image from the `build:` stanzas below and never consults a registry at all.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      # From .env, like every other credential in this stack: the DATABASE_URL
      # lines below embed the same password, so a separate Docker secret file
      # would only be a second copy of it to keep in sync.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is unset - run `bash scripts/setup-secrets.sh`}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # Single one-shot bootstrap: schema migration, then master-key init. Order
  # matters — `init_key` writes to `key_state`, which the 0001 baseline
  # migration creates — hence `&&` rather than two parallel commands.
  migrate:
    image: ${AUDR_REGISTRY:-ghcr.io/br3d}/audr-backend:${BACKEND_TAG:-0.1.1}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # One-shot. Must NOT restart: `api`/`worker` wait on it with
    # service_completed_successfully, so an unbounded `restart: on-failure`
    # turns a failed migration into a `docker compose up` that hangs forever
    # instead of failing. Fail fast.
    restart: "no"

  api:
    image: ${AUDR_REGISTRY:-ghcr.io/br3d}/audr-backend:${BACKEND_TAG:-0.1.1}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port in the project: this one process serves /api,
    # /health and the built SPA out of /app/static. See docs/containers.md.
    #
    # Published on :80 by default. Set AUDR_HTTP_PORT in .env to move it — :80
    # is often already taken by a local nginx or Portainer, and the resulting
    # "port is already allocated" is the most common first-run failure. Only the
    # host side is configurable; the container always listens on 8000, which is
    # what the healthcheck and the deploy health-gate talk to.
    ports:
      - "${AUDR_HTTP_PORT:-80}:8000"
    # Deliberately stdlib-Python and not `curl`: curl is not in the runtime
    # image, and installing it would add an apt layer for a one-line HTTP
    # request the interpreter already there can make. urllib raises on a
    # connection failure and on any 4xx/5xx, so a non-zero exit covers every
    # failure mode `curl -f` would.
    #
    # The except clause is not optional: letting the exception escape writes a
    # ~2KB traceback into `.State.Health.Log`, and Docker keeps only the last 5
    # entries at 4KB each, so the useful history gets crowded out. Printing the
    # exception gives one readable line ("[Errno 111] Connection refused").
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              sys.exit(0 if urllib.request.urlopen("http://localhost:8000/health/live", timeout=4).status == 200 else 1)
          except Exception as exc:
              print(exc)
              sys.exit(1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: ${AUDR_REGISTRY:-ghcr.io/br3d}/audr-backend:${BACKEND_TAG:-0.1.1}
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
