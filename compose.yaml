name: audr

# Installs the published release. Two commands, nothing to fill in:
#
#     bash scripts/setup-secrets.sh   # generates DB_PASSWORD and SECRET_KEY in .env
#     docker compose up -d
#
# The version you run is the image tag below, and it moves with the repo:
# `git pull && docker compose pull && docker compose up -d` upgrades you. To
# stay on an older release, check out its tag (`git checkout v0.1.0`) — the tag
# here always matches the checkout.
#
# Building from source instead:  docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Deploying from a private registry:  see compose.deploy.yaml

# The newest tag that actually exists in the registry, which is not necessarily this
# tree's VERSION. Publishing a release is three steps — cut the tag, dispatch
# `release.yml` to build it, then `scripts/promote-image.py` to move this line — and
# only the second puts a tag in GHCR. Nothing else may touch this anchor: it is the
# one line in the repository that names something outside it, so a tag written here
# before the registry has it makes a fresh clone fail `docker compose up -d` with
# `manifest unknown` (AUD-442). The rule, enforced offline by
# backend/tests/unit/test_version.py::test_compose_image_tag_matches and online by
# promote-image.py, is that this pin may trail VERSION but never lead it (AUD-545,
# AUD-546). VERSION says 0.1.2, whose dispatch has not run. See docs/releases.md.
x-backend-image: &backend_image ghcr.io/br3d/audr-backend:0.1.1

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      # Generated into .env by scripts/setup-secrets.sh, like every other
      # credential here; the DATABASE_URLs below embed the same value.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is unset - run `bash scripts/setup-secrets.sh`}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # One-shot bootstrap: schema migration, then master-key init. `&&` because
  # init_key writes to a table the migration creates. `restart: "no"` because
  # api/worker wait on it exiting 0 — retrying would hang `up` forever instead
  # of failing. See docs/containers.md.
  migrate:
    image: *backend_image
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: *backend_image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port: this one process serves /api, /health and the
    # SPA. Set AUDR_HTTP_PORT in .env if :80 is already taken on your host —
    # only the host side moves, the container always listens on 8000.
    ports:
      - "${AUDR_HTTP_PORT:-80}:8000"
    # Inlined, and only until the next publish — then this goes back to
    # `test: ["CMD", "python", "-m", "audr.operations.healthcheck"]` (AUD-442).
    # That revert is automatic — scripts/promote-image.py rewrites this block
    # when it moves the pin above, matching on the first line of this comment,
    # and backend/tests/unit/test_healthcheck.py fails the build if the two
    # files stop agreeing on it. Reword that line and the revert becomes a
    # no-op. It happens at promotion rather than at the cut (AUD-546) because
    # only then is the tag proven to be in the registry and built from the
    # release commit, which is what makes "this tag carries the module" a fact
    # instead of a hope.
    # That module is the tested reference implementation of the logic below
    # (backend/src/audr/operations/healthcheck.py, backend/tests/unit/
    # test_healthcheck.py) and is the better form: a command in the image, not a
    # Python program embedded in YAML. It cannot be used *here* yet, because
    # this file pins a published tag and a published tag lags main — 0.1.1 was
    # cut 2026-10-04, the module landed 2026-10-05, so the image above raises
    # ModuleNotFoundError and a clean clone showed `api` as `unhealthy` on
    # `docker compose up -d`. Nothing was actually broken (the port is published
    # regardless and no service gates on api's health), but it is the first
    # thing a new user sees. Keep this equivalent to the module: stdlib only, no
    # `curl` (none in the runtime image), `/health/live` not `/health/ready`
    # (readiness touches the DB and the master key, which a restart cannot fix),
    # one printed line instead of a raised traceback (~2KB, and Docker keeps
    # only 5 health-log entries, so one failure buries the history), and port
    # 8000 because only the host side of the published port is configurable.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              status = urllib.request.urlopen(
                  "http://localhost:8000/health/live", timeout=4
              ).status
          except Exception as exc:
              print(exc)
              sys.exit(1)
          if status != 200:
              print(f"/health/live returned HTTP {status}")
          sys.exit(0 if status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: *backend_image
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Inlined (worker), and only until the next publish — then this goes back
    # to `test: ["CMD", "python", "-m", "audr.operations.healthcheck",
    # "--worker"]` (AUD-539), for the same reason the api check above was
    # inlined under AUD-442: this file pins a published tag, and the published
    # 0.1.1 predates both `audr.operations.healthcheck` and its `--worker`
    # flag, so calling the module raises `ModuleNotFoundError`. (Even on a tag
    # carrying the module but not the flag it is still wrong: it falls through
    # to the old `main()`'s unconditional HTTP probe against a container with
    # nothing listening on :8000, reporting `unhealthy` for no real reason.)
    # (AUD-544, closed by AUD-546: the swap to the module form now happens in
    # scripts/promote-image.py, which only makes it against a tag it has proven
    # carries *both* the `--worker` flag and the beacon writer in
    # jobs/__main__.py. Against 0.1.1 or v0.1.2 it carries neither, so the
    # probe stays inlined and the false `unhealthy` cannot recur.)
    # Inline a stdlib-only equivalent instead: read the beacon file
    # `audr.jobs.__main__`'s poll loop ticks every 5s on its own schedule, and
    # fail only once it has gone 15s (3x the tick) without moving. A file, not
    # a DB query, for the same reason `/health/live` skips `/health/ready`: a
    # database outage the worker cannot fix by restarting must never show up
    # here.
    #
    # It diverges from the module in exactly one case, and that divergence is
    # the whole point: **a beacon file that was never created is a pass here,
    # and a failure in the module.** The module only ever runs against a tag
    # scripts/promote-image.py has proven contains the writer, so for it a
    # missing file means the worker died before its first beat. The inline
    # copy has no such guarantee — it runs against whatever tag the anchor at
    # the top of this file names, and every tag published so far (0.1.1,
    # v0.1.2) predates the writer in jobs/__main__.py, so the file is never
    # created and a strict read reports a perfectly live worker as
    # `unhealthy`. That was AUD-544, observed on a fresh clone. A probe that
    # cannot distinguish "this image has no beacon" from "the beacon stopped"
    # must not fail on the first; once it *has* beaten once, staleness is
    # judged normally.
    #
    # Keep the path and threshold in step with WORKER_HEARTBEAT_PATH /
    # WORKER_STALE_SECONDS in backend/src/audr/operations/healthcheck.py —
    # this reverts to the module form automatically on the next promotion
    # (scripts/promote-image.py), which is also the moment the divergence
    # above stops mattering; backend/tests/unit/test_healthcheck.py checks the
    # two stay in sync.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import os, sys, time
          if not os.path.exists("/app/worker-heartbeat"):
              sys.exit(0)
          try:
              last_beat = float(open("/app/worker-heartbeat").read())
          except Exception as exc:
              print(exc)
              sys.exit(1)
          age = time.time() - last_beat
          if age > 15:
              print(f"worker heartbeat is {age:.1f}s old, over the 15s limit")
          sys.exit(0 if age <= 15 else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
