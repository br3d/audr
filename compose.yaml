name: audr

# Installs the published release. Two commands, nothing to fill in:
#
#     bash scripts/setup-secrets.sh   # generates DB_PASSWORD and SECRET_KEY in .env
#     docker compose up -d
#
# The version you run is the image tag below, and it moves with the repo:
# `git pull && docker compose pull && docker compose up -d` upgrades you. To
# stay on an older release, check out its tag (`git checkout v0.1.0`) — the tag
# here always matches the checkout.
#
# Building from source instead:  docker compose -f compose.yaml -f compose.dev.yaml up -d --build
# Deploying from a private registry:  see compose.deploy.yaml

x-backend-image: &backend_image ghcr.io/br3d/audr-backend:0.1.2

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: audr
      POSTGRES_USER: audr
      # Generated into .env by scripts/setup-secrets.sh, like every other
      # credential here; the DATABASE_URLs below embed the same value.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is unset - run `bash scripts/setup-secrets.sh`}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audr -d audr"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - internal

  # One-shot bootstrap: schema migration, then master-key init. `&&` because
  # init_key writes to a table the migration creates. `restart: "no"` because
  # api/worker wait on it exiting 0 — retrying would hang `up` forever instead
  # of failing. See docs/containers.md.
  migrate:
    image: *backend_image
    command:
      - sh
      - -c
      - "python -m alembic upgrade head && python -m audr.operations.init_key"
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: "no"

  api:
    image: *backend_image
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # The only published port: this one process serves /api, /health and the
    # SPA. Set AUDR_HTTP_PORT in .env if :80 is already taken on your host —
    # only the host side moves, the container always listens on 8000.
    ports:
      - "${AUDR_HTTP_PORT:-80}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "audr.operations.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - internal

  worker:
    image: *backend_image
    restart: unless-stopped
    command: ["python", "-m", "audr.jobs"]
    environment:
      DATABASE_URL: postgresql+psycopg://audr:${DB_PASSWORD}@db:5432/audr
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Inlined (worker), and only until the next publish — then this goes back
    # to `test: ["CMD", "python", "-m", "audr.operations.healthcheck",
    # "--worker"]` (AUD-539), for the same reason the api check above was
    # inlined under AUD-442: this file pins a published tag, and the published
    # 0.1.2 predates `--worker` support. Calling the module here would not
    # raise `ModuleNotFoundError` (the module already exists) — it would fall
    # through to the old `main()`'s unconditional HTTP probe against a
    # container with nothing listening on :8000, reporting `unhealthy` for no
    # real reason. Inline a stdlib-only equivalent instead, which no tag can
    # fail to provide: read the beacon file `audr.jobs.__main__`'s poll loop
    # ticks every 5s on its own schedule, and fail only once it has gone 15s
    # (3x the tick) without moving. A file, not a DB query, for the same
    # reason `/health/live` skips `/health/ready`: a database outage the
    # worker cannot fix by restarting must never show up here. Keep the path
    # and threshold in step with WORKER_HEARTBEAT_PATH / WORKER_STALE_SECONDS
    # in backend/src/audr/operations/healthcheck.py — this reverts to the
    # module form automatically on the next release (scripts/release.sh);
    # backend/tests/unit/test_healthcheck.py checks the two stay in sync.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, time
          try:
              last_beat = float(open("/app/worker-heartbeat").read())
          except Exception as exc:
              print(exc)
              sys.exit(1)
          age = time.time() - last_beat
          if age > 15:
              print(f"worker heartbeat is {age:.1f}s old, over the 15s limit")
          sys.exit(0 if age <= 15 else 1)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - internal

volumes:
  db_data:

networks:
  internal:
    driver: bridge
