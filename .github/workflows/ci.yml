name: tests

# CI for contributions arriving on GitHub.
#
# The project's own pipeline runs on self-hosted Gitea Actions — see
# ci/gitea-overlay/README.md — which an outside contributor cannot reach. This
# workflow runs the same suite on GitHub-hosted runners so a pull request gets a
# verdict without access to that host.
#
# `pull_request` only, deliberately. A one-way mirror replays every branch of
# this repository into Gitea verbatim, and Gitea falls back to
# `.github/workflows` on any branch that has no `.gitea/workflows` of its own —
# so a `push` trigger here would make the mirror replay the full suite for every
# stale branch it syncs, on a single self-hosted runner. Gitea `main` carries the
# workflow overlay and the mirror opens no pull requests, so this file stays
# inert there. Pushes to `main` are covered by the Gitea `ci.yaml` job.
on:
  pull_request:

# A force-push to a pull-request branch supersedes the run it interrupted.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Mirrors the `lint` job in ci/gitea-overlay/workflows/ci.yaml, including its
    # deliberately narrow rule set: it blocks on the error classes that mean
    # "this code cannot run" (E9 syntax, F63/F7 broken constructs, F82 undefined
    # names) and nothing else. The full rule set from backend/pyproject.toml
    # still reports hundreds of findings, so switching it on wholesale would land
    # a permanently red gate (AUD-393). Keep the ruff version in step with the
    # Gitea job and with backend/pyproject.toml's dev extra.
    runs-on: ubuntu-latest
    container: ghcr.io/astral-sh/ruff:0.16.10
    steps:
      - uses: actions/checkout@v4
      - name: ruff (errors only) — backend
        run: ruff check --no-cache --select E9,F63,F7,F82 backend
      - name: ruff (errors only) — scripts
        run: ruff check --no-cache --select E9,F63,F7,F82 scripts

  tests:
    # scripts/test.sh drives docker compose (compose.test.yaml): postgres, a
    # WireMock provider stub, pytest and Vitest. Both are preinstalled on
    # ubuntu-latest, and the suite needs no secrets — every credential in that
    # compose file is a throwaway test fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Backend + frontend suites
        run: ./scripts/test.sh
