name: tests

# The GitHub-side test gate (AUD-409).
#
# The project's own pipeline runs on self-hosted Gitea Actions — see
# ci/gitea-overlay/README.md — which an outside contributor cannot reach. This
# workflow runs the same gates on GitHub-hosted runners, so that a contribution
# gets a verdict without access to that host and so that the README build badge
# reflects the state of `main`.
#
# Triggers, and why each one is safe with the Gitea mirror:
#
#   push (main only)  A one-way mirror replays this repository into Gitea. Every
#                     branch except `main` is pushed verbatim, and Gitea falls
#                     back to `.github/workflows` on a branch that carries no
#                     `.gitea/workflows` of its own — so a bare `on: push` here
#                     would make the mirror replay the full suite for every
#                     stale branch it syncs, on a single self-hosted runner
#                     (AUD-333). Filtering to `main` closes that: the mirror
#                     pushes branch `X` as `refs/heads/X`, which never matches
#                     this filter, and Gitea's own `main` carries the overlay so
#                     the fallback does not apply there either.
#   pull_request      Pre-merge coverage for outside contributions. The mirror
#                     opens no pull requests, so this is inert on the Gitea side.
#   workflow_call     Lets release.yml gate an image build on the same suite
#                     instead of keeping a second copy of it.
#
# Do NOT add a `tags:` trigger to any file in this directory. The mirror pushes
# tags verbatim, and a tagged commit has no `.gitea/workflows`, so Gitea would
# run this file through the fallback path alongside its own tag-triggered
# deploy.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test. Empty means the ref the caller ran on.
        type: string
        required: false
        default: ''

# A force-push to a branch supersedes the push/PR run it interrupted. A run
# called from release.yml passes an explicit `ref` and gets `github.run_id` in
# its group instead, so it is never cancelled by a second dispatch — the first
# dispatch may be queued behind release.yml's own `release-ghcr` lock, and having
# its test job cancelled underneath it would fail a build that was fine.
concurrency:
  group: tests-${{ inputs.ref || github.ref }}-${{ inputs.ref && github.run_id || 'ref' }}
  cancel-in-progress: true

jobs:
  lint:
    # Mirrors the `lint` job in ci/gitea-overlay/workflows/ci.yaml: the full ruff
    # rule set from backend/pyproject.toml and ruff.toml plus `format --check`,
    # in backend/ and at the repo root (scripts/). The narrow "errors only"
    # selection this job used before AUD-393 is gone — the full set is green and
    # every noqa in the tree carries a reason.
    #
    # Keep the ruff version in step with the Gitea job and with
    # backend/pyproject.toml's dev extra (AUD-392): an unpinned ruff makes the
    # gate's verdict depend on the day it ran.
    #
    # `docker run` rather than a job-level `container:`: the ruff image is
    # distroless and contains no shell, so GitHub cannot execute a `run:` step
    # inside it. The version of this job that used `container:` was never
    # exercised — it only triggered on pull requests, and this project does not
    # use them (docs/engineering-workflow.md).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: ruff check — backend
        run: docker run --rm -v "$PWD:/w" -w /w/backend ghcr.io/astral-sh/ruff:0.16.10 check --no-cache .
      - name: ruff format --check — backend
        run: docker run --rm -v "$PWD:/w" -w /w/backend ghcr.io/astral-sh/ruff:0.16.10 format --check --no-cache .
      - name: ruff check — scripts
        run: docker run --rm -v "$PWD:/w" -w /w ghcr.io/astral-sh/ruff:0.16.10 check --no-cache scripts/
      - name: ruff format --check — scripts
        run: docker run --rm -v "$PWD:/w" -w /w ghcr.io/astral-sh/ruff:0.16.10 format --check --no-cache scripts/

  scripts-parse:
    # `scripts/*.py` are invoked as `python3 scripts/foo.py` from a host shell,
    # not inside the 3.14 runtime image, so they must not use 3.14-only syntax.
    # This is the gate that catches AUD-392 directly: PEP 758 `except A, B:`
    # compiles on 3.14 and fails here. Same check as the Gitea job, including
    # its in-memory compile() — `compileall` would write `__pycache__/` as the
    # container's root user, which is untracked and not in .gitignore.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: scripts/ must parse on the oldest python3 we run them under
        run: |
          docker run --rm -v "$PWD:/w" -w /w python:3.13-slim python -c '
          import pathlib, sys
          paths = sorted(pathlib.Path("scripts").rglob("*.py"))
          bad = 0
          for p in paths:
              try:
                  compile(p.read_text(), str(p), "exec")
              except SyntaxError as exc:
                  print(f"{p}:{exc.lineno}: {exc.msg}", file=sys.stderr)
                  bad += 1
          print(f"checked {len(paths)} files under python {sys.version.split()[0]}")
          sys.exit(1 if bad else 0)
          '
      - name: No tracked symlink may point outside the worktree (AUD-711)
        run: ./scripts/check-tracked-symlinks.sh

  backend-mypy:
    # mypy --strict on backend/src (AUD-690), gated against a frozen baseline
    # of pre-existing errors rather than the 86-error backlog the first real
    # strict run turned up — see backend/mypy-baseline.txt and
    # backend/check_mypy_baseline.py. Mirrors the `backend-mypy` job in
    # ci/gitea-overlay/workflows/deploy.yaml. No database dependency, so no
    # teardown beyond the ephemeral runner itself.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: mypy (strict) — backend/src, gated against the baseline
        run: docker compose -f compose.test.yaml --profile backend run --rm --build backend-mypy

  tests:
    # scripts/test.sh drives docker compose (compose.test.yaml): postgres, a
    # WireMock provider stub, pytest and Vitest. Both docker and compose are
    # preinstalled on ubuntu-latest, and the suite needs no secrets — every
    # credential in that compose file is a throwaway test fixture.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Backend + frontend suites
        # AUDR_SKIP_STATIC turns off the ruff and mypy phases test.sh gained in
        # AUD-744. They exist for the local run — the gate this team actually
        # merges on — and the `lint` and `backend-mypy` jobs above already
        # enforce both here, on their own runners, in parallel with this job.
        # Running them inside this one too would add minutes to the critical
        # path to re-prove a verdict another job has already given. Their phase
        # steps below therefore report `skip` on CI, which is the ledger's
        # explicit "never reached" and not a silent pass.
        env:
          AUDR_SKIP_STATIC: '1'
        run: ./scripts/test.sh

      # ---- Per-phase verdicts (AUD-715) -------------------------------------
      #
      # The step above is the gate; these steps are the *diagnosis*. It runs the
      # whole suite in one step, so on a red run the job metadata says only
      # "Backend + frontend suites: failure" — which does not distinguish the
      # database never coming up, a failed image build, a pytest failure, a
      # broken `npm ci`, a Vitest failure and an API-types drift. Five
      # diagnoses, five different fixes.
      #
      # The artifacts below carry the answer, and nothing an agent has can open
      # them: the download endpoint needs authentication, the job log needs
      # repository admin, and `gh` is not installed on the agent host (AUD-714).
      # Step *metadata* — names, conclusions, timestamps — is the only channel
      # readable with no credentials on a public repo, and is how the AUD-714
      # diagnosis was in fact done.
      #
      # So test.sh writes a phase ledger and these steps replay it into that
      # channel. `GET /actions/jobs/<id>` then names the failing phase to any
      # reader, forever, with no token.
      #
      # These steps cannot red a green run: each one mirrors a phase's recorded
      # exit code, and a non-zero phase already failed the gate step above. A
      # phase the run never reached reports `skip` and its step is skipped, so
      # "the frontend leg died" and "the frontend leg passed" stay distinct.
      - name: Phase ledger
        id: phases
        if: always()
        run: ./scripts/ci-phase-ledger.sh .test-phases.tsv

      # Each verdict reads its state from an `env:` mapping rather than
      # interpolating `${{ }}` into the shell. These outputs are our own, but
      # inlining a step output into `run:` is the shape that turns any future
      # untrusted one into shell injection.
      # ruff and backend_mypy (AUD-744) report `skip` in this job by design —
      # see AUDR_SKIP_STATIC on the gate step. They are listed anyway so the
      # ledger's "one step per phase" contract holds for every slug in
      # ci-phase-ledger.sh's PHASES, and so that a future run which *does*
      # execute them here has somewhere to say so.
      - name: 'phase: static lint (ruff)'
        if: always() && steps.phases.outputs.ruff != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.ruff }}
          DETAIL: ${{ steps.phases.outputs.ruff_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: db-test up + healthcheck'
        if: always() && steps.phases.outputs.db_up != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.db_up }}
          DETAIL: ${{ steps.phases.outputs.db_up_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: backend test images build'
        if: always() && steps.phases.outputs.backend_build != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.backend_build }}
          DETAIL: ${{ steps.phases.outputs.backend_build_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: backend suite (pytest)'
        if: always() && steps.phases.outputs.backend_suite != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.backend_suite }}
          DETAIL: ${{ steps.phases.outputs.backend_suite_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: mypy (strict) vs baseline'
        if: always() && steps.phases.outputs.backend_mypy != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.backend_mypy }}
          DETAIL: ${{ steps.phases.outputs.backend_mypy_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: frontend dependency install (npm ci)'
        if: always() && steps.phases.outputs.frontend_install != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.frontend_install }}
          DETAIL: ${{ steps.phases.outputs.frontend_install_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: frontend suite (Vitest)'
        if: always() && steps.phases.outputs.frontend_suite != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.frontend_suite }}
          DETAIL: ${{ steps.phases.outputs.frontend_suite_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      - name: 'phase: generated API types vs backend/openapi.json'
        if: always() && steps.phases.outputs.api_types != 'skip'
        env:
          STATE: ${{ steps.phases.outputs.api_types }}
          DETAIL: ${{ steps.phases.outputs.api_types_detail }}
        run: |
          echo "$DETAIL"
          [ "$STATE" = pass ]

      # Why this step is configured so carefully (AUD-714): it used to report
      # `success` while uploading nothing at all, on green and red runs alike.
      # Two defaults combined to hide the suite logs completely:
      #
      #   * `include-hidden-files` defaults to **false**, and every path here is
      #     dot-prefixed, so the glob matched nothing;
      #   * `if-no-files-found: ignore` then turned "matched nothing" into a
      #     silent pass.
      #
      # The visible symptom was `GET /actions/runs/<id>/artifacts` returning
      # `total_count: 0` for a failing run, which reads like "the suite died
      # before writing a log" — and cost two agents a verification cycle each on
      # that false premise. The control that settles it: a *passing* run returned
      # `total_count: 0` too.
      #
      # So: opt the dotfiles in, and fail if nothing was produced.
      #
      # One artifact per log, rather than one bundle of three, and that is
      # deliberate. **No agent on this project can read an artifact's contents**
      # — the download endpoint requires authentication, `/actions/jobs/<id>/logs`
      # is 403 without repository admin, and `gh` is not installed on the agent
      # host. What *is* readable tokenlessly on a public repo is run, job, step
      # and artifact *metadata*: names, sizes, conclusions and timestamps.
      #
      # So the split carries the diagnosis in the only channel an unauthenticated
      # reader can hear. `GET /runs/<id>/artifacts` returning `test-env` and
      # `test-backend` but no `test-frontend` says the run died in the frontend
      # leg, from metadata alone, to anyone, forever. A single bundled zip
      # collapses all three into one opaque size.
      #
      # `error` on the env log only: scripts/test.sh writes it before anything
      # in it can fail, so a run that executed test.sh at all has one. If that
      # step goes red the suite died before test.sh's first line, which is
      # itself the finding. The two suite logs get `warn`, because their absence
      # is the signal and must not be masked into a pass nor confused with a
      # genuine suite failure.
      # `.test-phases.tsv` rides along with the env log rather than taking an
      # artifact of its own: the phase steps above already put its *verdicts* in
      # readable metadata, so a separate artifact would add a name to the
      # artifact list without adding a signal. test.sh truncates both files on
      # its first lines, so both exist whenever test.sh ran at all.
      - name: Upload env + pre-suite log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-env-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .test-env.log
            .test-phases.tsv
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload backend suite log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-backend.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Upload frontend suite log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-frontend.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
